<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Prompt | Kursus AI JKR</title>
<meta name="description" content="Semua prompt Hari 1 Kursus Aplikasi AI dalam Tugas Rasmi, sedia disalin ke Gemini.">
<link rel="stylesheet" href="assets/style.css">
<script>try{var d=document.documentElement,p=localStorage.getItem("palette"),t=localStorage.getItem("theme");if(p&&p!=="biru")d.dataset.palette=p;if(t)d.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="prompt">
<!-- Fail ini dijana oleh build.py. Sunting prompt dalam halaman modul, bukan di sini. -->

<div class="wrap mod-head">
  <p class="eyebrow">Perpustakaan prompt &middot; Hari 1</p>
  <h1>Bank <span class="accent">Prompt</span></h1>
  <p class="lead">Semua prompt Hari 1, sedia disalin ke Gemini. Isi teks dalam [ ] dengan maklumat anda. Gunakan data rekaan atau data yang telah dibuang maklumat peribadi.</p>
  <input id="q" class="search" type="search" placeholder="Cari prompt: surat, minit, video, imej..." aria-label="Cari prompt">
  <div class="filters">
    <button type="button" class="on" data-cat="semua">Semua</button>
    <button type="button" data-cat="teks">Teks</button>
    <button type="button" data-cat="imej">Imej</button>
    <button type="button" data-cat="muzik">Muzik</button>
    <button type="button" data-cat="video">Video</button>
    <button type="button" data-cat="h1">Minit mesyuarat</button>
  </div>
  <p class="empty">Tiada prompt sepadan. Cuba perkataan lain.</p>
</div>

<div class="wrap" style="padding-bottom:40px">

</div>
